name: Telegram test

# Sends the current digest once, on demand, to check the Owner's bot secrets.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Load the latest published data
        run: |
          mkdir -p data/site data/history data/cache-out
          git fetch --depth=1 origin risk-data
          git show FETCH_HEAD:latest/scenarios.json > data/site/scenarios.json
          git show FETCH_HEAD:latest/signals.json > data/site/signals.json
          git show FETCH_HEAD:cache/signals_history.json > data/cache-out/signals_history.json || true
      - name: Send the digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m geointel.risk notify --force
