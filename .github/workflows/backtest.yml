name: Backtest on real data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/geointel/risk/backtest_real.py"
      - ".github/workflows/backtest.yml"
  pull_request:
    paths:
      - "src/geointel/risk/backtest_real.py"
      - ".github/workflows/backtest.yml"

concurrency:
  group: backtest-real
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .

      - name: Replay archived GDELT and Sentinel-1 data
        env:
          CDSE_CLIENT_ID: ${{ secrets.CDSE_CLIENT_ID }}
          CDSE_CLIENT_SECRET: ${{ secrets.CDSE_CLIENT_SECRET }}
        run: python -m geointel.risk backtest-real --out data/site/backtest-real.json

      - uses: actions/upload-artifact@v4
        with:
          name: backtest-real
          path: data/site/backtest-real.json

      - name: Publish to risk-data branch
        if: github.ref == 'refs/heads/main'
        run: |
          set -e
          git config user.name "geointel-bot"
          git config user.email "geointel-bot@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch --depth=1 origin risk-data
            rm -rf publish && git worktree prune
            git worktree add publish FETCH_HEAD
            cd publish
            git checkout -B risk-data
            mkdir -p latest
            cp ../data/site/backtest-real.json latest/backtest-real.json
            git add latest/backtest-real.json
            git commit -qm "Backtest on real data $(date -u +%Y-%m-%d)" || { echo "No changes"; exit 0; }
            if git push origin risk-data; then exit 0; fi
            cd ..
            sleep 30
          done
          exit 1
