name: PR evidence (advisory)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: pr-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No checkout, PR code, shell interpolation, extra secrets or API writes.
      - name: Collect one bounded API snapshot
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          retries: 0
          script: |
            // BEGIN TESTABLE COLLECTOR
            async function collect(github, context, env, now) {
              const repository = 'bur5/geointel';
              const repositoryId = 1375475901;
              const workflowId = 363226887;
              const workflowPath = '.github/workflows/ci.yml';
              const baselineBlob = '7418c8175a5f398351de27338d0006fb0795f369';
              const expected = ['test (3.11)', 'test (3.12)', 'postgres-integration'];
              const args = {owner: 'bur5', repo: 'geointel'};
              const issues = [];
              const number = context.payload.pull_request?.number;
              const eventPr = context.payload.pull_request;
              const candidate = {
                head_sha: eventPr?.head?.sha ?? null,
                head_repository: eventPr?.head?.repo?.full_name ?? null,
                base_branch: eventPr?.base?.ref ?? null,
                base_sha: eventPr?.base?.sha ?? null,
                event_merge_sha: env.GITHUB_SHA ?? null,
              };
              const report = {
                schema_version: 'geointel-pr-evidence-v1',
                advisory: true,
                repository,
                pr_number: number ?? null,
                candidate,
                provenance: {
                  api: 'https://api.github.com',
                  producer: 'github-actions-workflow-author-controlled',
                  workflow_ref: env.GITHUB_WORKFLOW_REF ?? null,
                  workflow_sha: env.GITHUB_WORKFLOW_SHA ?? null,
                  run_id: env.GITHUB_RUN_ID ?? null,
                  run_attempt: env.GITHUB_RUN_ATTEMPT ?? null,
                  actor: env.GITHUB_ACTOR ?? null,
                  event: context.eventName,
                  started_at: now(),
                  completed_at: null,
                  snapshot_count: 1,
                  ci_workflow_id: workflowId,
                  ci_workflow_path: workflowPath,
                  ci_baseline_blob: baselineBlob,
                },
                independently_verified: [],
                observed_only: [
                  'GitHub-reported job and step execution/conclusions',
                  'run PR association and base SHA (not historical checkout attestation)',
                ],
                not_verified: [
                  'test semantics, coverage and actual checkout integration',
                  'independent reviewer or Owner approval',
                  'collector integrity against PR-author workflow edits',
                  'refs after completed_at or merge-time atomicity',
                ],
                observed_refs: {before: null, after: null},
                ci_run: null,
                checks: expected.map(name => ({name, state: 'unknown', evidence: null})),
                ignored_commit_statuses: true,
                issues,
                evidence_complete: false,
                observation_state: 'unknown',
              };
              const time = value => typeof value === 'string' && Number.isFinite(Date.parse(value));
              const sha = value => typeof value === 'string' && /^[0-9a-f]{40}$/.test(value);
              function requireEvidence(condition, code) {
                if (!condition) { issues.push(code); throw new Error('incomplete'); }
              }
              function refs(pr) {
                return {head_sha: pr.head?.sha, base_sha: pr.base?.sha, base_branch: pr.base?.ref};
              }
              function match(pr) {
                return pr.number === number && pr.state === 'open'
                  && pr.base?.repo?.id === repositoryId
                  && pr.head?.repo?.full_name === candidate.head_repository
                  && pr.head?.sha === candidate.head_sha
                  && pr.base?.sha === candidate.base_sha
                  && pr.base?.ref === candidate.base_branch;
              }
              async function boundedList(method, params, key) {
                const items = [];
                for (let page = 1; page <= 3; page++) {
                  const {data} = await method({...args, ...params, per_page: 100, page});
                  requireEvidence(Array.isArray(data[key]) && Number.isInteger(data.total_count), 'malformed_list');
                  items.push(...data[key]);
                  if (items.length >= data.total_count) return items;
                  requireEvidence(data[key].length > 0, 'incomplete_pagination');
                }
                requireEvidence(false, 'pagination_limit');
              }
              function state(status, conclusion) {
                if (['queued', 'in_progress', 'waiting', 'pending', 'requested'].includes(status)
                    && conclusion == null) return 'pending';
                if (status !== 'completed') return 'unknown';
                if (conclusion === 'success') return 'success';
                if (conclusion === 'skipped') return 'skipped';
                if (['failure', 'cancelled', 'timed_out', 'action_required', 'startup_failure', 'stale'].includes(conclusion)) return 'failure';
                return 'unknown'; // neutral and undocumented states cannot satisfy evidence
              }
              try {
                requireEvidence(context.eventName === 'pull_request'
                  && `${context.repo.owner}/${context.repo.repo}` === repository
                  && context.payload.repository?.id === repositoryId
                  && Number.isInteger(number) && number > 0
                  && candidate.base_branch === 'main'
                  && sha(candidate.head_sha) && sha(candidate.base_sha)
                  && sha(candidate.event_merge_sha) && sha(env.GITHUB_WORKFLOW_SHA)
                  && /^\d+$/.test(env.GITHUB_RUN_ID ?? '')
                  && /^[1-9]\d*$/.test(env.GITHUB_RUN_ATTEMPT ?? '')
                  && typeof env.GITHUB_WORKFLOW_REF === 'string'
                  && typeof env.GITHUB_ACTOR === 'string', 'invalid_event');
                const before = (await github.rest.pulls.get({...args, pull_number: number})).data;
                report.observed_refs.before = refs(before);
                requireEvidence(match(before), 'stale_candidate_before');
                // Independent metadata comparison, not independent execution of tests.
                for (const [label, ref] of [['head', candidate.head_sha], ['base', candidate.base_sha]]) {
                  const owner = label === 'head' ? before.head.repo.owner.login : args.owner;
                  const repo = label === 'head' ? before.head.repo.name : args.repo;
                  const {data} = await github.rest.repos.getContent({owner, repo, path: workflowPath, ref});
                  requireEvidence(data.type === 'file' && data.sha === baselineBlob, `ci_baseline_mismatch_${label}`);
                }
                report.independently_verified.push('CI workflow blob matches pinned baseline at head and base');
                const runs = await boundedList(github.rest.actions.listWorkflowRuns, {
                  workflow_id: workflowId, head_sha: candidate.head_sha, event: 'pull_request',
                }, 'workflow_runs');
                const selected = runs.filter(run => run.workflow_id === workflowId
                  && run.head_sha === candidate.head_sha && run.event === 'pull_request')
                  .sort((a, b) => b.id - a.id)[0];
                requireEvidence(selected, 'missing_ci_run');
                const run = (await github.rest.actions.getWorkflowRun({...args, run_id: selected.id})).data;
                report.ci_run = {
                  id: run.id, attempt: run.run_attempt, workflow_id: run.workflow_id,
                  path: run.path, event: run.event, head_sha: run.head_sha,
                  status: run.status, conclusion: run.conclusion,
                  created_at: run.created_at, updated_at: run.updated_at, url: run.html_url,
                };
                const association = run.pull_requests?.find(pr => pr.number === number);
                requireEvidence(run.id === selected.id && run.workflow_id === workflowId
                  && run.path === workflowPath && run.event === 'pull_request'
                  && run.repository?.id === repositoryId
                  && run.head_sha === candidate.head_sha
                  && run.head_repository?.full_name === candidate.head_repository
                  && association?.head?.sha === candidate.head_sha
                  && association?.base?.sha === candidate.base_sha
                  && association?.base?.ref === candidate.base_branch,
                'ci_identity_or_candidate_mismatch');
                requireEvidence(time(run.created_at) && time(run.updated_at), 'missing_ci_timestamps');
                requireEvidence(Number.isInteger(run.run_attempt) && run.run_attempt > 0, 'missing_run_attempt');
                report.independently_verified.push('Actions run workflow/repository identity and PR/head/base metadata comparisons');
                const jobs = await boundedList(github.rest.actions.listJobsForWorkflowRunAttempt, {
                  run_id: run.id, attempt_number: run.run_attempt,
                }, 'jobs');
                for (const check of report.checks) {
                  const found = jobs.filter(job => job.name === check.name);
                  if (found.length !== 1) { issues.push(`missing_or_duplicate_job:${check.name}`); continue; }
                  const job = found[0];
                  check.evidence = {
                    job_id: job.id, run_id: job.run_id, run_attempt: job.run_attempt,
                    head_sha: job.head_sha, status: job.status, conclusion: job.conclusion,
                    started_at: job.started_at, completed_at: job.completed_at, url: job.html_url,
                    check_run_id: null, app_id: null,
                    steps: (job.steps ?? []).map(step => ({number: step.number, status: step.status, conclusion: step.conclusion})),
                  };
                  if (job.run_id !== run.id || job.run_attempt !== run.run_attempt || job.head_sha !== candidate.head_sha) {
                    issues.push(`job_candidate_mismatch:${check.name}`); continue;
                  }
                  const prefix = `https://api.github.com/repos/${repository}/check-runs/`;
                  const idText = typeof job.check_run_url === 'string' && job.check_run_url.startsWith(prefix)
                    ? job.check_run_url.slice(prefix.length) : '';
                  if (!/^\d+$/.test(idText)) { issues.push(`invalid_check_source:${check.name}`); continue; }
                  const checkId = Number(idText);
                  const {data: source} = await github.rest.checks.get({...args, check_run_id: checkId});
                  check.evidence.check_run_id = checkId;
                  check.evidence.app_id = source.app?.id ?? null;
                  if (job.id !== checkId || source.id !== checkId || source.app?.id !== 15368 || source.app?.slug !== 'github-actions'
                      || source.name !== check.name || source.head_sha !== candidate.head_sha
                      || source.status !== job.status || source.conclusion !== job.conclusion) {
                    issues.push(`untrusted_or_racing_check:${check.name}`); continue;
                  }
                  check.state = state(job.status, job.conclusion);
                  if (check.state === 'success' && (!time(job.started_at) || !time(job.completed_at))) {
                    check.state = 'unknown'; issues.push(`missing_job_timestamps:${check.name}`);
                  }
                  if (check.state === 'success' && (!job.steps?.length
                      || job.steps.some(step => step.status !== 'completed' || step.conclusion !== 'success'))) {
                    check.state = job.steps?.some(step => step.conclusion === 'skipped') ? 'skipped' : 'unknown';
                    issues.push(`incomplete_steps:${check.name}`);
                  }
                }
                if (state(run.status, run.conclusion) !== 'success') issues.push('ci_run_not_successful');
                const finalRun = (await github.rest.actions.getWorkflowRun({...args, run_id: run.id})).data;
                requireEvidence(finalRun.run_attempt === run.run_attempt
                  && finalRun.status === run.status && finalRun.conclusion === run.conclusion,
                'ci_run_changed_during_snapshot');
                const after = (await github.rest.pulls.get({...args, pull_number: number})).data;
                report.observed_refs.after = refs(after);
                requireEvidence(match(after), 'stale_candidate_after');
                report.independently_verified.push('PR head/base refs matched event at snapshot start and end');
                if (report.checks.some(check => check.state === 'unknown')) issues.push('unknown_checks');
                if (report.checks.some(check => check.state === 'pending')) issues.push('pending_checks');
                if (report.checks.some(check => check.state === 'skipped')) issues.push('skipped_checks');
              } catch (error) {
                // Do not persist exception text, response bodies, headers or credentials.
                if (error.message !== 'incomplete') issues.push('api_or_collector_error');
              }
              const states = report.checks.map(check => check.state);
              report.evidence_complete = issues.length === 0 && states.every(value => value === 'success');
              report.observation_state = states.includes('failure') ? 'failure'
                : states.includes('unknown') ? 'unknown'
                : states.includes('pending') ? 'pending'
                : states.includes('skipped') ? 'skipped'
                : report.evidence_complete ? 'success' : 'unknown';
              report.provenance.completed_at = now();
              return JSON.parse(JSON.stringify(report, (_key, value) => value === undefined ? null : value));
            }
            // END TESTABLE COLLECTOR
            const report = await collect(github, context, process.env, () => new Date().toISOString());
            require('fs').writeFileSync('pr-evidence.json', JSON.stringify(report, null, 2) + '\n');
            if (!report.evidence_complete) core.setFailed('Advisory evidence incomplete; inspect JSON artifact. Not an approval.');
      - name: Upload advisory snapshot
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: pr-evidence.json
          if-no-files-found: error
          retention-days: 1
