name: Risk snapshot

on:
  schedule:
    - cron: "17 5 * * *" # daily, 05:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/geointel/risk/**"
      - "frontend/**"
      - ".github/workflows/risk-pipeline.yml"
  pull_request:
    paths:
      - "src/geointel/risk/**"
      - ".github/workflows/risk-pipeline.yml"

# Pull-request checks run in their own group so they never queue ahead of (or cancel) the
# runs that publish the site; a newer push to the same PR cancels its older check.
concurrency:
  group: risk-snapshot-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .

      - name: Load previous snapshot
        run: |
          mkdir -p data
          if git fetch --depth=1 origin risk-data 2>/dev/null; then
            git show FETCH_HEAD:latest/risk.json > data/previous.json 2>/dev/null || rm -f data/previous.json
            git show FETCH_HEAD:models/trained.json > data/trained.json 2>/dev/null || rm -f data/trained.json
            mkdir -p data/cache
            for f in $(git ls-tree --name-only FETCH_HEAD cache/ 2>/dev/null); do
              git show "FETCH_HEAD:$f" > "data/$f"
            done
            mkdir -p data/history
            for f in $(git ls-tree --name-only FETCH_HEAD history/ 2>/dev/null | grep -- '-scenarios.json$' | tail -400); do
              git show "FETCH_HEAD:$f" > "data/$f"
            done
          fi

      - name: Fetch public datasets
        env:
          GEOINTEL_CACHE_DIR: data/cache
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
          METACULUS_API_TOKEN: ${{ secrets.METACULUS_API_TOKEN }}
          CDSE_CLIENT_ID: ${{ secrets.CDSE_CLIENT_ID }}
          CDSE_CLIENT_SECRET: ${{ secrets.CDSE_CLIENT_SECRET }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: python -m geointel.risk fetch --raw-dir data/raw

      - name: Build snapshot
        env:
          GEOINTEL_CACHE_DIR: data/cache
          GEOINTEL_CACHE_OUT: data/cache-out
        run: |
          prev=""
          [ -f data/previous.json ] && prev="--previous data/previous.json"
          python -m geointel.risk build --raw-dir data/raw --out data/site/risk.json $prev
          python -m geointel.risk accuracy --history-dir data/history --today data/site/scenarios.json --out data/site/accuracy.json

      - name: Telegram digest (only if the Owner set up a bot)
        if: github.event_name == 'schedule' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m geointel.risk notify

      - uses: actions/upload-artifact@v4
        with:
          name: risk-snapshot
          path: |
            data/site/risk.json
            data/site/hazards.json
            data/site/scenarios.json
            data/site/links.json
            data/site/signals.json
            data/site/backtest.json
            data/site/accuracy.json
            data/site/regional.json
            data/trained.json
            data/site/regions/
            data/raw/manifest.json

      - name: Publish to risk-data branch
        if: github.ref == 'refs/heads/main'
        run: |
          set -e
          day=$(date -u +%Y-%m-%d)
          git config user.name "geointel-bot"
          git config user.email "geointel-bot@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin risk-data >/dev/null; then
            git fetch --depth=1 origin risk-data
            git worktree add publish FETCH_HEAD
            cd publish && git checkout -B risk-data
          else
            git worktree add --detach publish
            cd publish && git checkout --orphan risk-data && git rm -rfq .
          fi
          mkdir -p latest history cache
          [ -f ../data/raw/trade.json ] && cp ../data/raw/trade.json cache/trade.json
          cp ../data/cache-out/*.json cache/ 2>/dev/null || true
          cp ../data/site/signals.json latest/signals.json
          cp ../data/site/backtest.json latest/backtest.json
          cp ../data/site/accuracy.json latest/accuracy.json
          cp ../data/site/risk.json latest/risk.json
          cp ../data/site/hazards.json latest/hazards.json
          cp ../data/site/scenarios.json latest/scenarios.json
          cp ../data/site/links.json latest/links.json
          cp ../data/site/scenarios.json "history/${day}-scenarios.json"
          cp ../data/raw/manifest.json latest/manifest.json
          cp ../data/site/risk.json "history/${day}.json"
          cp ../data/site/signals.json "history/${day}-signals.json"
          [ -f ../data/trained.json ] && mkdir -p models && cp ../data/trained.json models/trained.json
          [ -f ../data/site/regional.json ] && cp ../data/site/regional.json latest/regional.json
          printf '# GeoIntel risk data\n\nGenerated by the Risk snapshot workflow. Do not edit.\n' > README.md
          git add -A
          git commit -qm "Risk snapshot ${day}" || { echo "No changes"; exit 0; }
          git push origin risk-data

  build-site:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: risk-snapshot
          path: snapshot
      - name: Build site with the latest snapshot
        working-directory: frontend
        run: |
          npm ci
          mkdir -p public/data
          cp ../snapshot/site/risk.json public/data/risk.json
          cp ../snapshot/site/hazards.json public/data/hazards.json
          cp ../snapshot/site/scenarios.json public/data/scenarios.json
          cp ../snapshot/site/links.json public/data/links.json
          cp ../snapshot/site/signals.json public/data/signals.json
          cp ../snapshot/site/backtest.json public/data/backtest.json
          cp ../snapshot/site/accuracy.json public/data/accuracy.json
          [ -f ../snapshot/site/regional.json ] && cp ../snapshot/site/regional.json public/data/regional.json
          [ -f ../snapshot/trained.json ] && cp ../snapshot/trained.json public/data/trained.json || true
          [ -d ../snapshot/site/regions ] && cp -r ../snapshot/site/regions public/data/regions
          if git fetch --depth=1 origin risk-data 2>/dev/null; then
            git show FETCH_HEAD:latest/backtest-real.json > public/data/backtest-real.json 2>/dev/null || rm -f public/data/backtest-real.json
          fi
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy-site:
    # Deployment runs in its own job after the Pages artifact upload has completed.
    needs: build-site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
