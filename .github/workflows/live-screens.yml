name: Live site screenshots
# Manual: screenshots of the published site (pages × themes) for design review.
on:
  workflow_dispatch:
    inputs:
      pages:
        description: "hash routes, e.g. overview country:USA country:RUS scenarios"
        default: "overview country:USA country:RUS"
      themes:
        description: "light dark newyear"
        default: "light dark"
permissions:
  contents: read
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Screenshots
        env:
          PAGES: ${{ inputs.pages }}
          THEMES: ${{ inputs.themes }}
        run: |
          mkdir shots && cd shots
          npm init -y >/dev/null && npm i playwright@1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          cat > shoot.mjs <<'JS'
          import { chromium } from 'playwright';
          const base = 'https://bur5.github.io/geointel/';
          const browser = await chromium.launch();
          for (const theme of process.env.THEMES.split(' ').filter(Boolean)) {
            for (const width of [1440, 390]) {
              const page = await browser.newPage({ viewport: { width, height: 1000 } });
              await page.addInitScript(([t]) => { localStorage.setItem('geointel.theme', t); }, [theme]);
              for (const item of process.env.PAGES.split(' ').filter(Boolean)) {
                const [route, iso] = item.split(':');
                if (iso) await page.addInitScript(([c]) => { localStorage.setItem('geointel.country', c); }, [iso]);
                await page.goto(base + '#' + route, { waitUntil: 'networkidle' });
                await page.waitForTimeout(2500);
                const name = `${theme}-${width}-${route}${iso ? '-' + iso : ''}.png`;
                await page.screenshot({ path: name, fullPage: width === 390 ? false : true });
                console.log('saved', name);
              }
              await page.close();
            }
          }
          await browser.close();
          JS
          node shoot.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: live-screens
          path: shots/*.png
