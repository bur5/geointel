name: CI

on:
  push:
    branches-ignore: [risk-data, ci-shots]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m compileall -q src tests migrations
      - name: Verify migrations
        env:
          DATABASE_URL: sqlite:///./migration-check.db
        run: alembic upgrade head
      - run: pytest
      - name: Mocked official-provider contract and security tests (no live requests)
        run: pytest tests/test_provider_runtime.py tests/test_ucdp.py tests/test_views.py tests/test_acled_cast.py tests/test_official_providers.py -q
      - name: Offline validation smoke test
        env:
          DATABASE_URL: sqlite:///./validation-smoke.db
        run: python -m geointel.validation run five-country-v1 --case spain --json
      - name: Offline monitoring smoke test
        env:
          DATABASE_URL: sqlite:///./monitoring-smoke.db
        run: pytest tests/test_monitoring.py -q
      - name: Start application and check health
        env:
          DATABASE_URL: sqlite:///./startup-check.db
        run: |
          alembic upgrade head
          uvicorn geointel.api.app:app --host 127.0.0.1 --port 8000 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          python - <<'PY'
          import json
          import time
          import urllib.request

          for attempt in range(30):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8000/health") as response:
                      assert response.status == 200
                      assert json.load(response)["status"] == "ok"
                  break
              except Exception:
                  if attempt == 29:
                      raise
                  time.sleep(0.2)
          PY

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          GEOINTEL_SCREENSHOTS: ${{ github.workspace }}/shots
      - name: Publish screenshots for review (ci-shots branch)
        if: github.event_name == 'push'
        working-directory: ${{ github.workspace }}
        run: |
          [ -d shots ] || exit 0
          dest="${GITHUB_REF_NAME//\//-}"
          git config user.name "geointel-bot"
          git config user.email "geointel-bot@users.noreply.github.com"
          git fetch --depth=1 origin ci-shots && git worktree add publish FETCH_HEAD && (cd publish && git checkout -B ci-shots) \
            || (git worktree add --detach publish && cd publish && git checkout --orphan ci-shots && git rm -rfq .)
          mkdir -p "publish/$dest" && cp shots/*.png "publish/$dest/"
          cd publish && git add -A && (git commit -qm "Screenshots for $GITHUB_REF_NAME" && git push origin ci-shots || echo "no changes")

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: geointel
          POSTGRES_PASSWORD: geointel_ci_only
          POSTGRES_DB: geointel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U geointel -d geointel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Migrate PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://geointel:geointel_ci_only@127.0.0.1:5432/geointel
        run: alembic upgrade head
      - name: Verify PostgreSQL persistence and immutability
        env:
          POSTGRES_TEST_URL: postgresql+psycopg://geointel:geointel_ci_only@127.0.0.1:5432/geointel
        run: pytest tests/test_postgres_integration.py tests/test_early_warning.py
