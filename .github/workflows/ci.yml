name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m compileall -q src tests migrations
      - name: Verify migrations
        env:
          DATABASE_URL: sqlite:///./migration-check.db
        run: alembic upgrade head
      - run: pytest
      - name: Start application and check health
        env:
          DATABASE_URL: sqlite:///./startup-check.db
        run: |
          alembic upgrade head
          uvicorn geointel.api.app:app --host 127.0.0.1 --port 8000 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          python - <<'PY'
          import json
          import time
          import urllib.request

          for attempt in range(30):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8000/health") as response:
                      assert response.status == 200
                      assert json.load(response)["status"] == "ok"
                  break
              except Exception:
                  if attempt == 29:
                      raise
                  time.sleep(0.2)
          PY
