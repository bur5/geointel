name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m compileall -q src tests migrations
      - name: Verify migrations
        env:
          DATABASE_URL: sqlite:///./migration-check.db
        run: alembic upgrade head
      - run: pytest
      - name: Mocked official-provider contract and security tests (no live requests)
        run: pytest tests/test_provider_runtime.py tests/test_ucdp.py tests/test_views.py tests/test_acled_cast.py tests/test_official_providers.py -q
      - name: Offline validation smoke test
        env:
          DATABASE_URL: sqlite:///./validation-smoke.db
        run: python -m geointel.validation run five-country-v1 --case spain --json
      - name: Offline monitoring smoke test
        env:
          DATABASE_URL: sqlite:///./monitoring-smoke.db
        run: pytest tests/test_monitoring.py -q
      - name: Start application and check health
        env:
          DATABASE_URL: sqlite:///./startup-check.db
        run: |
          alembic upgrade head
          uvicorn geointel.api.app:app --host 127.0.0.1 --port 8000 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          python - <<'PY'
          import json
          import time
          import urllib.request

          for attempt in range(30):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8000/health") as response:
                      assert response.status == 200
                      assert json.load(response)["status"] == "ok"
                  break
              except Exception:
                  if attempt == 29:
                      raise
                  time.sleep(0.2)
          PY

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16@sha256:3950ad7c3148ca2175ef1b6c36c9efbf78957ae8fbe8b3a5d7c35af50500382f
        env:
          POSTGRES_USER: geointel
          POSTGRES_PASSWORD: geointel_ci_only
          POSTGRES_DB: geointel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U geointel -d geointel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Migrate PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://geointel:geointel_ci_only@127.0.0.1:5432/geointel
        run: alembic upgrade head
      - name: Verify PostgreSQL persistence and immutability
        env:
          POSTGRES_TEST_URL: postgresql+psycopg://geointel:geointel_ci_only@127.0.0.1:5432/geointel
        run: |
          : "${POSTGRES_TEST_URL:?PostgreSQL integration tests require POSTGRES_TEST_URL}"
          report="$(mktemp)"
          trap 'rm -f "$report"' EXIT
          python -m pytest tests/test_postgres_integration.py --junitxml="$report"
          python - "$report" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          suite, = ET.parse(sys.argv[1]).getroot().findall("testsuite")
          cases = suite.findall("testcase")
          if (
              not cases
              or int(suite.attrib["tests"]) != len(cases)
              or any(int(suite.attrib[key]) for key in ("skipped", "failures", "errors"))
              or any(len(case) for case in cases)
          ):
              sys.exit("PostgreSQL tests must run to completion without skips, failures or errors.")
          PY

  required-ci:
    name: CI required checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    needs: [test, postgres-integration]
    if: ${{ always() }}
    steps:
      - name: Require successful test jobs
        env:
          TEST_RESULT: ${{ needs.test.result }}
          POSTGRES_RESULT: ${{ needs.postgres-integration.result }}
        run: |
          printf 'Python matrix: %s\nPostgreSQL integration: %s\n' "$TEST_RESULT" "$POSTGRES_RESULT"
          [[ "$TEST_RESULT" == success && "$POSTGRES_RESULT" == success ]]
