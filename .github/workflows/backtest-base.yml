name: Time machine (base model)
# docs/backtest-rules.md. "tuning" and "validation" periods run monthly and on demand.
# The holdout period (2021-2025) runs only in the protected "holdout" environment, which the
# owner approves in GitHub; each approval is visible in the environment's history.
on:
  schedule:
    - cron: "11 10 4 * *"
  workflow_dispatch:
    inputs:
      holdout:
        description: "Open the holdout period 2021-2025 (needs the owner's approval)"
        default: "false"
permissions:
  contents: write
concurrency:
  group: backtest-base
  cancel-in-progress: false
jobs:
  run:
    if: github.event_name == 'schedule' || inputs.holdout != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: python -m pip install -e . pyreadr pandas
      - run: python -m geointel.risk backtest-base --out data/site/backtest_base.json
      - name: Store in risk-data
        run: |
          set -e
          git config user.name "geointel-bot"
          git config user.email "geointel-bot@users.noreply.github.com"
          git fetch --depth=1 origin risk-data
          git worktree add publish FETCH_HEAD
          cd publish && git checkout -B risk-data
          mkdir -p models
          cp ../data/site/backtest_base.json models/backtest_base.json
          git add models/backtest_base.json
          git commit -qm "Time machine $(date -u +%Y-%m-%d)" || { echo "No changes"; exit 0; }
          for i in 1 2 3; do git push origin risk-data && break; git pull --rebase origin risk-data; done
  holdout:
    if: github.event_name == 'workflow_dispatch' && inputs.holdout == 'true'
    runs-on: ubuntu-latest
    environment: holdout
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: python -m pip install -e . pyreadr pandas
      - run: python -m geointel.risk backtest-base --out data/site/backtest_holdout.json
        env:
          GEOINTEL_HOLDOUT_APPROVED: "1"
      - name: Store in risk-data
        run: |
          set -e
          git config user.name "geointel-bot"
          git config user.email "geointel-bot@users.noreply.github.com"
          git fetch --depth=1 origin risk-data
          git worktree add publish FETCH_HEAD
          cd publish && git checkout -B risk-data
          mkdir -p models/holdout
          cp ../data/site/backtest_holdout.json "models/holdout/$(date -u +%Y-%m-%d)-${GITHUB_SHA::7}.json"
          views=$(ls models/holdout | wc -l)
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); d['holdout_views']=int(sys.argv[2]); json.dump(d, open('models/backtest_holdout_latest.json','w'))" ../data/site/backtest_holdout.json "$views"
          git add models/holdout models/backtest_holdout_latest.json
          git commit -qm "Holdout opened $(date -u +%Y-%m-%d)" || exit 0
          for i in 1 2 3; do git push origin risk-data && break; git pull --rebase origin risk-data; done
