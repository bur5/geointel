name: Train base models
# Monthly: pre-registered forward validation and refit of the trained base models
# (docs/validation-rules.md). The result is stored in the risk-data branch (models/).
on:
  schedule:
    - cron: "43 9 3 * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: train-models
  cancel-in-progress: false
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: python -m pip install -e .
      - name: Validate and fit
        run: python -m geointel.risk train --out data/site/trained.json
      - name: Store in risk-data
        run: |
          set -e
          git config user.name "geointel-bot"
          git config user.email "geointel-bot@users.noreply.github.com"
          git fetch --depth=1 origin risk-data
          git worktree add publish FETCH_HEAD
          cd publish && git checkout -B risk-data
          mkdir -p models
          cp ../data/site/trained.json models/trained.json
          git add models/trained.json
          git commit -qm "Trained models $(date -u +%Y-%m-%d)" || { echo "No changes"; exit 0; }
          for i in 1 2 3; do git push origin risk-data && break; git pull --rebase origin risk-data; done
