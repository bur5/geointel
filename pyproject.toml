[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geointel"
version = "0.1.0"
description = "Reproducible geopolitical conflict-risk analysis vertical slice"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2", "fastapi>=0.115,<1", "httpx>=0.27,<1",
  "pydantic-settings>=2.5,<3", "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3", "uvicorn[standard]>=0.30,<1"
]
[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.6,<1"]
[tool.hatch.build.targets.wheel]
packages = ["src/geointel"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
